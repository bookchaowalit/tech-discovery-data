# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported (requires-python) and a current release.
        python-version: ["3.11", "3.13"]
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      python-version: ${{ matrix.python-version }}
      # Installs from uv.lock (uv sync --frozen --all-extras): [lake] brings the pinned
      # solo-empire-data-lake runtime so the Bronze round-trip tests run instead of skipping,
      # [dev] brings pytest, ruff and mypy, [sentry] the opt-in SDK.
      # Ratchet: measured 90.39% on 2026-10-22 (ADR-0004: threshold = measured, rounded down); raise it as tests grow.
      coverage-threshold: "90"
      # Lake runtime must be importable, then the offline tests under coverage (lake tests write only to a temp dir).
      test-command: |
        python -c "from discovery_data import store; assert store.shared_runtime_available()"
        python -m pytest -q -rs --cov --cov-report=

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
