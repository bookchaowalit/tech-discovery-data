[project]
name = "book-discovery-data"
version = "0.1.0"
description = "Lake-first technology discovery data contract for Solo Empire."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Shared lake-first runtime (Bronze Parquet, DuckDB reads), pinned to an exact
# commit so CI runs the lake tests reproducibly. Without the
# package, SOLO_DATA_LAKE_ROOT may point at a data-lake checkout.
lake = [
  "solo-empire-data-lake[lake] @ https://github.com/bookchaowalit/data-lake-core/archive/b8f8698995a4d4283247bd432d521b337ef8ec94.tar.gz",
]
dev = ["pytest>=8", "pytest-cov>=7", "ruff==0.16.9", "mypy==2.4.0"]
# Opt-in error reporting for the API (src/discovery_data/observability.py); off without SENTRY_DSN.
sentry = ["sentry-sdk>=2.72,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
book-discovery-data = "discovery_data.api:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E9", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["src"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
# Gradual: bodies are checked (check_untyped_defs) without requiring annotations
# everywhere. New modules are strict (override below); tighten the rest module by module.
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["discovery_data.observability"]
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_reexport = true
warn_return_any = true

# The shared lake runtime ships no stubs or py.typed.
[[tool.mypy.overrides]]
module = ["data_lake", "data_lake.*", "pyarrow", "pyarrow.*", "duckdb"]
ignore_missing_imports = true
